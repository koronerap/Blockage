name: Idea or request
description: Something Blockage could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: The thing you are trying to make or get done, more than the button that would do it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Blockage, by hand, or in another program.
  - type: textarea
    id: elsewhere
    attributes:
      label: Anywhere it already works well
      description: Blender, MagicaVoxel, Qubicle, a game's own editor — how it works there, if it does.
